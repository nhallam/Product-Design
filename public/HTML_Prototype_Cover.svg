    <!-- ghost header -->
    <rect x="365" y="152" width="110" height="14" rx="7" fill="#DCE6F8"/>
    <!-- segmented tabs -->
    <path d="M365 192H455" stroke="#1D3F8F" stroke-width="2.5"/>
    <path d="M475 192H545" stroke="#DCE6F8" stroke-width="2.5"/>
    <!-- text box -->
    <rect x="365" y="216" width="180" height="58" rx="10" stroke="#9FB9E8" stroke-width="1.5"/>
    <rect x="379" y="234" width="100" height="9" rx="4.5" fill="#DCE6F8"/>
    <rect x="379" y="251" width="140" height="9" rx="4.5" fill="#E9F0FB"/>
    <!-- list cards -->
    <rect x="365" y="292" width="180" height="48" rx="10" stroke="#9FB9E8" stroke-width="1.5"/>
    <rect x="377" y="304" width="24" height="24" rx="6" stroke="#9FB9E8" stroke-width="1.5"/>
    <rect x="411" y="306" width="78" height="8" rx="4" fill="#DCE6F8"/>
    <rect x="411" y="320" width="52" height="8" rx="4" fill="#E9F0FB"/>
    <rect x="365" y="352" width="180" height="48" rx="10" stroke="#9FB9E8" stroke-width="1.5"/>
    <rect x="377" y="364" width="24" height="24" rx="6" stroke="#9FB9E8" stroke-width="1.5"/>
    <rect x="411" y="366" width="78" height="8" rx="4" fill="#DCE6F8"/>
    <rect x="411" y="380" width="52" height="8" rx="4" fill="#E9F0FB"/>
    <!-- ghost primary button -->
    <rect x="365" y="440" width="180" height="40" rx="20" stroke="#1D3F8F" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="425" y="456" width="60" height="8" rx="4" fill="#DCE6F8"/>
    <!-- tab bar -->
    <path d="M341 524H569" stroke="#E3EBF8" stroke-width="1.5"/>
    <circle cx="383" cy="548" r="8" stroke="#9FB9E8" stroke-width="1.5"/>
    <circle cx="431" cy="548" r="8" stroke="#9FB9E8" stroke-width="1.5"/>
    <circle cx="479" cy="548" r="8" stroke="#1D3F8F" stroke-width="2"/>
    <circle cx="527" cy="548" r="8" stroke="#9FB9E8" stroke-width="1.5"/>
  </g>

  <!-- RIGHT PHONE -->
  <g>
    <rect x="620" y="88" width="250" height="500" rx="40" stroke="#1D3F8F" stroke-width="3"/>
    <rect x="631" y="99" width="228" height="478" rx="30" stroke="#9FB9E8" stroke-width="1.5"/>
    <rect x="710" y="112" width="70" height="18" rx="9" stroke="#1D3F8F" stroke-width="2"/>
    <!-- ghost header -->
    <rect x="655" y="152" width="90" height="14" rx="7" fill="#DCE6F8"/>
    <!-- big hero card -->
