    <rect x="655" y="312" width="130" height="10" rx="5" fill="#DCE6F8"/>
    <rect x="655" y="330" width="166" height="9" rx="4.5" fill="#E9F0FB"/>
    <rect x="655" y="347" width="150" height="9" rx="4.5" fill="#E9F0FB"/>
    <!-- input + ghost button pair -->
    <rect x="655" y="382" width="180" height="38" rx="10" stroke="#9FB9E8" stroke-width="1.5"/>
    <rect x="668" y="396" width="70" height="9" rx="4.5" fill="#E9F0FB"/>
    <rect x="655" y="440" width="86" height="40" rx="20" stroke="#1D3F8F" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="755" y="440" width="80" height="40" rx="20" stroke="#9FB9E8" stroke-width="1.5"/>
    <!-- tab bar -->
    <path d="M631 524H859" stroke="#E3EBF8" stroke-width="1.5"/>
    <circle cx="673" cy="548" r="8" stroke="#9FB9E8" stroke-width="1.5"/>
    <circle cx="721" cy="548" r="8" stroke="#1D3F8F" stroke-width="2"/>
    <circle cx="769" cy="548" r="8" stroke="#9FB9E8" stroke-width="1.5"/>
    <circle cx="817" cy="548" r="8" stroke="#9FB9E8" stroke-width="1.5"/>
  </g>

  <!-- version switches below -->
  <g>
    <rect x="432" y="624" width="56" height="30" rx="15" stroke="#9FB9E8" stroke-width="1.5"/>
    <rect x="449" y="636" width="22" height="6" rx="3" fill="#DCE6F8"/>
    <rect x="500" y="624" width="56" height="30" rx="15" stroke="#9FB9E8" stroke-width="1.5"/>
    <rect x="517" y="636" width="22" height="6" rx="3" fill="#DCE6F8"/>
    <rect x="568" y="624" width="56" height="30" rx="15" fill="#E1E9FB" stroke="#1D3F8F" stroke-width="2"/>
    <rect x="585" y="636" width="22" height="6" rx="3" fill="#1D3F8F"/>
    <rect x="636" y="624" width="56" height="30" rx="15" stroke="#9FB9E8" stroke-width="1.5"/>
    <rect x="653" y="636" width="22" height="6" rx="3" fill="#DCE6F8"/>
    <rect x="704" y="624" width="56" height="30" rx="15" stroke="#9FB9E8" stroke-width="1.5"/>
    <rect x="721" y="636" width="22" height="6" rx="3" fill="#DCE6F8"/>
  </g>
