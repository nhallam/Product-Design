<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Technical line drawing: two phones + version switches, light/dark blue -->
  <rect width="1200" height="720" fill="#FAFBFE"/>

  <!-- fine blueprint grid -->
  <g stroke="#E3EBF8" stroke-width="1">
    <path d="M100 0V720M200 0V720M300 0V720M400 0V720M500 0V720M600 0V720M700 0V720M800 0V720M900 0V720M1000 0V720M1100 0V720"/>
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200"/>
  </g>
  <!-- corner registration marks -->
  <g stroke="#B9CCEE" stroke-width="1.5">
    <path d="M70 60H90M80 50V70"/>
    <path d="M1110 60H1130M1120 50V70"/>
    <path d="M70 660H90M80 650V670"/>
    <path d="M1110 660H1130M1120 650V670"/>
  </g>

  <!-- dimension line above phones -->
  <g stroke="#9FB9E8" stroke-width="1.5">
    <path d="M330 52V72"/>
    <path d="M870 52V72"/>
    <path d="M330 62H870" stroke-dasharray="5 5"/>
  </g>

  <!-- LEFT PHONE -->
  <g>
    <rect x="330" y="88" width="250" height="500" rx="40" stroke="#1D3F8F" stroke-width="3"/>
    <rect x="341" y="99" width="228" height="478" rx="30" stroke="#9FB9E8" stroke-width="1.5"/>
